<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨香斋 · 中式灵境写作</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --chinese-red: #B2221A; --dark-red: #8B1E1A; --gold: #F5C542;
      --antique-gold: #D4AF37; --paper-color: #FDF8ED; --ink-color: #2C2C2C;
    }
    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--chinese-red);
      min-height: 100vh; display: flex; flex-direction: column;
      position: relative; overflow-x: hidden;
    }
    .main-container {
      position: relative; z-index: 20; max-width: 1100px;
      margin: 1.5rem auto; padding: 0 1.2rem; width: 100%; flex: 1;
    }
    .scroll-header {
      background: linear-gradient(145deg, var(--dark-red), #9C2E1F);
      border: 2px solid var(--antique-gold);
      border-radius: 48px; padding: 1.2rem 2rem; margin-bottom: 2rem;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .title-area { display: flex; align-items: center; gap: 16px; width: 100%; margin-bottom: 1rem; }
    .chinese-stamp {
      background: var(--gold); width: 55px; height: 55px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; font-weight: bold;
    }
    h1 {
      font-family: 'ZCOOL QingKe HuangYou', cursive;
      font-size: 2.4rem; color: var(--gold);
      letter-spacing: 4px;
    }
    .tool-palette { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .tool-item {
      background: #FFFAF0; border: 2px solid var(--antique-gold);
      border-radius: 32px; padding: 8px 16px;
      font-family: inherit; font-weight: bold; color: #8B2C1D;
      cursor: pointer; transition: all 0.2s;
    }
    .tool-item:hover { background: var(--gold); transform: translateY(-2px); }
    select, input[type="number"], input[type="color"] {
      background: #FFF9EF; border: 2px solid #C29B42;
      padding: 8px 12px; border-radius: 32px;
      font-family: inherit; cursor: pointer;
    }
    input[type="color"] { width: 50px; height: 40px; padding: 3px; }
    .scroll-editor {
      background: var(--paper-color); border-radius: 28px;
      box-shadow: 0 20px 35px -10px black;
      padding: 2rem;
    }
    #editor {
      background: var(--paper-color); min-height: 60vh;
      padding: 2rem; font-size: 24px; line-height: 1.85;
      outline: none; color: var(--ink-color);
      font-family: 'Ma Shan Zheng', cursive;
      border: none; width: 100%;
    }
    #editor[placeholder]:empty:before {
      content: attr(placeholder); color: #B89A6A; font-style: italic;
    }
    .toast-msg {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #2B2B2B; color: #FFE6B3;
      padding: 12px 24px; border-radius: 40px;
      font-size: 1rem; z-index: 200;
      opacity: 0; transition: opacity 0.3s;
    }
    body.dark {
      --chinese-red: #1a1a1a; --paper-color: #2a2a2a; --ink-color: #f0f0f0;
    }
    body.dark #editor { background: #2a2a2a; color: #f0f0f0; }
  </style>
</head>
<body>

<div class="main-container">
  <div class="scroll-header">
    <div class="title-area">
      <div class="chinese-stamp">墨</div>
      <div>
        <h1>灵境 · 墨香斋</h1>
        <div style="color: #FFE0B5; font-size: 0.9rem;">传统中式写作平台</div>
      </div>
    </div>
    <div class="tool-palette">
      <select id="fontSelect">
        <option value="'Ma Shan Zheng', cursive">马山正体</option>
        <option value="'ZCOOL QingKe HuangYou', cursive">站酷黄油体</option>
        <option value="'Noto Serif SC', serif">思源宋体</option>
      </select>
      <input type="number" id="fontSize" value="60" min="14" max="120" style="width: 80px;">
      <input type="color" id="fontColor" value="#2C2C2C">
      <select id="directionSelect">
        <option value="horizontal">Horizontal</option>
        <option value="vertical">Vertical</option>
      </select>
      <button class="tool-item" id="darkToggleBtn"> 夜墨</button>
      <button class="tool-item" id="saveTxtBtn">📄 保存</button>
      <button class="tool-item" id="captureImgBtn">🖌️ 截图</button>
      <label class="tool-item" style="cursor: pointer;">
        📂 Subir fuente
        <input type="file" id="customFontUpload" accept=".ttf,.otf,.woff,.woff2" style="display: none;">
      </label>
    </div>
  </div>

  <div class="scroll-editor">
    <div id="editor" contenteditable="true" placeholder="点击开始书写..."></div>
  </div>
</div>
<div id="toastMsg" class="toast-msg"></div>

<script>
  const editor = document.getElementById('editor');
  const fontSelect = document.getElementById('fontSelect');
  const fontSizeInput = document.getElementById('fontSize');
  const fontColorInput = document.getElementById('fontColor');
  const directionSelect = document.getElementById('directionSelect');
  const darkBtn = document.getElementById('darkToggleBtn');
  const saveTxt = document.getElementById('saveTxtBtn');
  const captureImg = document.getElementById('captureImgBtn');
  const fontUpload = document.getElementById('customFontUpload');

  function showMessage(msg) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 2000);
  }

  // Cargar preferencias guardadas
  const savedContent = localStorage.getItem('wenxin_content');
  const savedFont = localStorage.getItem('wenxin_font') || "'Ma Shan Zheng', cursive";
  const savedSize = localStorage.getItem('wenxin_fontsize') || '60';
  const savedColor = localStorage.getItem('wenxin_color') || '#2C2C2C';
  const savedDir = localStorage.getItem('wenxin_direction') || 'horizontal';
  const savedDark = localStorage.getItem('wenxin_darkmode') === 'true';

  if (savedContent) editor.innerHTML = savedContent;
  editor.style.fontFamily = savedFont;
  editor.style.fontSize = savedSize + 'px';
  editor.style.color = savedColor;
  editor.style.writingMode = savedDir === 'vertical' ? 'vertical-rl' : 'horizontal-tb';
  if (savedDark) document.body.classList.add('dark');

  // Actualizar selects
  fontSelect.value = savedFont;
  fontSizeInput.value = savedSize;
  fontColorInput.value = savedColor;
  directionSelect.value = savedDir;

  // Event listeners simples
  editor.addEventListener('input', () => localStorage.setItem('wenxin_content', editor.innerHTML));
  
  fontSelect.addEventListener('change', () => {
    editor.style.fontFamily = fontSelect.value;
    localStorage.setItem('wenxin_font', fontSelect.value);
    showMessage('Fuente cambiada: ' + fontSelect.options[fontSelect.selectedIndex].text);
  });
  
  fontSizeInput.addEventListener('input', () => {
    editor.style.fontSize = fontSizeInput.value + 'px';
    localStorage.setItem('wenxin_fontsize', fontSizeInput.value);
  });
  
  fontColorInput.addEventListener('input', () => {
    editor.style.color = fontColorInput.value;
    localStorage.setItem('wenxin_color', fontColorInput.value);
  });
  
  directionSelect.addEventListener('change', () => {
    editor.style.writingMode = directionSelect.value === 'vertical' ? 'vertical-rl' : 'horizontal-tb';
    localStorage.setItem('wenxin_direction', directionSelect.value);
  });

  darkBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('wenxin_darkmode', document.body.classList.contains('dark'));
    showMessage(document.body.classList.contains('dark') ? 'Modo oscuro' : 'Modo claro');
  });

  // Carga de fuentes personalizadas - VERSIÓN SIMPLIFICADA
  fontUpload.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      showMessage('Cargando fuente...');
      
      const fontData = await file.arrayBuffer();
      const fontName = 'CustomFont' + Date.now();
      const fontFace = new FontFace(fontName, fontData);
      
      await fontFace.load();
      document.fonts.add(fontFace);
      
      // Añadir al selector
      const option = document.createElement('option');
      option.value = fontName;
      option.text = '✨ ' + file.name.replace(/\.[^/.]+$/, "");
      fontSelect.appendChild(option);
      fontSelect.value = fontName;
      editor.style.fontFamily = fontName;
      
      localStorage.setItem('wenxin_font', fontName);
      showMessage('✅ Fuente cargada: ' + option.text);
    } catch (err) {
      console.error(err);
      showMessage('❌ Error al cargar la fuente');
    }
    e.target.value = '';
  });

  // Guardar texto
  saveTxt.addEventListener('click', () => {
    const text = editor.innerText.trim() || "Sin contenido";
    const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
    const link = document.createElement('a');
    link.download = 'texto_' + new Date().toISOString().slice(0,10) + '.txt';
    link.href = URL.createObjectURL(blob);
    link.click();
    showMessage('📜 Texto guardado');
  });

  // Capturar imagen - VERSIÓN MEJORADA
  captureImg.addEventListener('click', async () => {
    const container = document.querySelector('.scroll-editor');
    if (!container) return;
    
    showMessage(' Generando imagen...');
    
    try {
      // Esperar a que las fuentes carguen
      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 1000));
      
      const canvas = await html2canvas(container, {
        scale: 4,
        backgroundColor: '#FDF8ED',
        useCORS: true,
        allowTaint: true,
        logging: false
      });
      
      // Convertir a blanco y negro
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i+1] + data[i+2]) / 3;
        const val = avg > 200 ? 255 : 0;
        data[i] = val;
        data[i+1] = val;
        data[i+2] = val;
      }
      
      ctx.putImageData(imageData, 0, 0);
      
      const link = document.createElement('a');
      link.download = 'caligrafia_' + new Date().toISOString().slice(0,10) + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      showMessage('✅ Imagen guardada en 4K B/N');
    } catch (err) {
      console.error(err);
      showMessage('❌ Error al generar imagen');
    }
  });

  // Atajos de teclado
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveTxt.click();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
      e.preventDefault();
      captureImg.click();
    }
  });

  // Mensaje inicial
  showMessage('✅ Listo para escribir');
</script>
</body>
</html>
