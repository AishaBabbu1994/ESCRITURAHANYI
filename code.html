<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>传统中式写作平台 | Zen Writer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Fuentes estilo caligrafía -->
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@300;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --chinese-red: #C21807; /* Rojo intenso */
      --dark-red: #8B0000;
      --gold: #FFD700;
      --antique-gold: #D4AF37;
      --paper-color: #fcf6e5;
      --ink-color: #2b2b2b;
      --border-pattern: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h20v20H0z" fill="none"/><path d="M0 10h20M10 0v20" stroke="%23D4AF37" stroke-opacity="0.2"/></svg>');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Noto Serif SC', 'Ma Shan Zheng', serif;
      background-color: var(--chinese-red);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 100%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239e0b0f' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      color: var(--ink-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* === ANIMACIONES DE FONDO === */
    .decorations {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    @keyframes peek {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }

    @keyframes cloudMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100vw); }
    }

    /* Elementos decorativos animados */
    .lantern {
      position: absolute;
      top: -10px;
      font-size: 4rem;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
      animation: sway 3s ease-in-out infinite;
      transform-origin: top center;
      z-index: 2;
    }
    .lantern.left { left: 5%; animation-delay: 0.5s; }
    .lantern.right { right: 5%; animation-delay: 0s; }

    .panda {
      position: absolute;
      bottom: -10px;
      font-size: 5rem;
      z-index: 1;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
    }
    .panda.left { 
      left: -20px; 
      transform: rotate(10deg); 
      animation: peek 4s ease-in-out infinite;
    }
    .panda.right { 
      right: -20px; 
      transform: rotate(-10deg); 
      animation: peek 5s ease-in-out infinite reverse;
    }

    .cloud {
      position: absolute;
      font-size: 8rem;
      opacity: 0.15;
      color: #fff;
      top: 20%;
      animation: cloudMove 40s linear infinite;
    }
    .cloud:nth-child(2) { top: 60%; animation-duration: 60s; animation-delay: -20s; font-size: 6rem; }

    .falling-leaves span {
      position: absolute;
      font-size: 1.5rem;
      animation: floatUp 15s linear infinite;
      opacity: 0;
    }

    /* === CONTENEDOR PRINCIPAL === */
    .main-wrapper {
      position: relative;
      z-index: 10;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* === HEADER === */
    header {
      background: linear-gradient(135deg, var(--dark-red), var(--chinese-red));
      border: 2px solid var(--antique-gold);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    
    header::before {
      content: "";
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 10px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    h1 {
      font-family: 'ZCOOL QingKe HuangYou', cursive;
      color: var(--gold);
      font-size: 2.5rem;
      text-shadow: 2px 2px 0px #000;
      margin: 0;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* === INPUTS & SELECTS === */
    .control-item {
      position: relative;
    }

    select, input[type="number"], input[type="color"] {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--antique-gold);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: 'Noto Serif SC', serif;
      color: var(--dark-red);
      font-weight: bold;
      outline: none;
      height: 40px;
    }

    input[type="color"] {
      width: 50px;
      padding: 2px;
      cursor: pointer;
    }

    /* === BOTONES TIPO SELLO === */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-left: 15px;
    }

    .seal-btn {
      width: 45px;
      height: 45px;
      background: #fff;
      border: 2px solid var(--chinese-red);
      border-radius: 4px;
      color: var(--chinese-red);
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 0 var(--dark-red);
      position: relative;
      overflow: hidden;
    }

    .seal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--dark-red);
      background: var(--chinese-red);
      color: var(--gold);
      border-color: var(--gold);
    }

    .seal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 var(--dark-red);
    }

    /* === EDITOR === */
    .editor-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .scroll-top, .scroll-bottom {
      height: 20px;
      background: #3e2723;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 5;
    }

    .scroll-top::after, .scroll-bottom::after {
      content: "";
      position: absolute;
      width: 40px;
      height: 100%;
      background: var(--gold);
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.8;
    }

    #editor {
      background-color: var(--paper-color);
      background-image: var(--border-pattern);
      color: var(--ink-color);
      flex: 1;
      min-height: 50vh;
      padding: 40px 50px;
      font-size: 24px;
      line-height: 1.8;
      outline: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      border-left: 10px solid #eaddcf;
      border-right: 10px solid #eaddcf;
      position: relative;
      /* Vertical text support (optional styled via JS, but sticking to horizontal for usability) */
      overflow-y: auto;
    }

    #editor::before {
      content: "🐼 🎋";
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 20px;
      opacity: 0.3;
      pointer-events: none;
    }

    #editor[placeholder]:empty:before {
      content: attr(placeholder);
      color: #999;
      opacity: 0.6;
    }

    /* === DARK MODE === */
    body.dark-mode {
      --chinese-red: #2a0a0a;
      --dark-red: #000;
      --paper-color: #1a1a1a;
      --ink-color: #d4d4d4;
      --border-pattern: none;
    }
    
    body.dark-mode .lantern { filter: brightness(0.7); }
    body.dark-mode #editor { border-color: #333; }

    /* === FOOTER === */
    footer {
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      margin-top: auto;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; }
      .controls { width: 100%; justify-content: center; }
      .btn-group { width: 100%; justify-content: center; margin: 10px 0 0 0; }
      #editor { padding: 20px; font-size: 18px; }
      .lantern { font-size: 3rem; }
      .panda { font-size: 3.5rem; }
    }
  </style>
</head>
<body>

  <!-- Elementos decorativos animados -->
  <div class="decorations">
    <div class="lantern left">🏮</div>
    <div class="lantern right">🏮</div>
    
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>
    
    <div class="panda left">🐼🎋</div>
    <div class="panda right">🪭🐼</div>
    
    <div class="falling-leaves" id="leavesContainer">
      <!-- Generated by JS -->
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div class="brand">
        <div style="font-size: 3rem;">🧧</div>
        <div>
          <h1>墨香 • 写作</h1>
          <span style="color: #ffcccc; font-size: 0.9rem;">传统中式写作平台</span>
        </div>
      </div>

      <div class="controls">
        <div class="control-item">
          <select id="fontSelect">
            <option value="Ma Shan Zheng">马山正 (Ma Shan Zheng)</option>
            <option value="ZCOOL QingKe HuangYou">站酷庆科黄油 (QingKe)</option>
            <option value="Noto Serif SC">思源宋体 (Noto Serif)</option>
          </select>
        </div>

        <div class="control-item">
          <input type="number" id="fontSize" value="24" min="12" max="72" title="字体大小">
        </div>

        <div class="control-item">
          <input type="color" id="fontColor" value="#2b2b2b" title="字体颜色">
        </div>
        
        <div class="btn-group">
          <button class="seal-btn" onclick="toggleDark()" title="Modo Noche">🌓</button>
          <button class="seal-btn" onclick="downloadTxt()" title="Guardar TXT">📜</button>
          <button class="seal-btn" onclick="downloadImage()" title="Guardar Imagen">🖼️</button>
          <label class="seal-btn" style="cursor: pointer;" title="Subir Fuente">
            📂
            <input type="file" id="fontUpload" accept=".ttf, .otf" style="display: none;">
          </label>
        </div>
      </div>
    </header>

    <div class="editor-container">
      <div class="scroll-top"></div>
      <div id="editor" contenteditable="true" placeholder="在此挥毫泼墨 (Escribe aquí)..."></div>
      <div class="scroll-bottom"></div>
    </div>

    <footer>
      © 2024 传统文化设计 | Diseñado con inspiración oriental
    </footer>
  </div>

  <script>
    // === GENERAR HOJAS DE BAMBÚ FLOTANTES ===
    const leavesContainer = document.getElementById('leavesContainer');
    const leaves = ['🍃', '🎋', '🍂', '✨'];
    
    for (let i = 0; i < 10; i++) {
      const leaf = document.createElement('span');
      leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
      leaf.style.left = Math.random() * 100 + 'vw';
      leaf.style.animationDuration = (Math.random() * 10 + 10) + 's';
      leaf.style.animationDelay = (Math.random() * 10) + 's';
      leavesContainer.appendChild(leaf);
    }

    // === LÓGICA DEL EDITOR ===
    const editor = document.getElementById('editor');
    const fontSelect = document.getElementById('fontSelect');
    const fontSize = document.getElementById('fontSize');
    const fontColor = document.getElementById('fontColor');
    const fontUpload = document.getElementById('fontUpload');

    // Cargar estado
    function loadState() {
      if(localStorage.getItem('content')) editor.innerHTML = localStorage.getItem('content');
      if(localStorage.getItem('font')) {
        editor.style.fontFamily = localStorage.getItem('font');
        fontSelect.value = localStorage.getItem('font');
      }
      if(localStorage.getItem('size')) {
        editor.style.fontSize = localStorage.getItem('size') + 'px';
        fontSize.value = localStorage.getItem('size');
      }
      if(localStorage.getItem('color')) {
        editor.style.color = localStorage.getItem('color');
        fontColor.value = localStorage.getItem('color');
      }
    }
    loadState();

    // Event Listeners
    editor.addEventListener('input', () => localStorage.setItem('content', editor.innerHTML));
    
    fontSelect.addEventListener('change', () => {
      editor.style.fontFamily = fontSelect.value;
      localStorage.setItem('font', fontSelect.value);
    });

    fontSize.addEventListener('input', () => {
      editor.style.fontSize = fontSize.value + 'px';
      localStorage.setItem('size', fontSize.value);
    });

    fontColor.addEventListener('input', () => {
      editor.style.color = fontColor.value;
      localStorage.setItem('color', fontColor.value);
    });

    function toggleDark() {
      document.body.classList.toggle('dark-mode');
    }

    // Subir fuente personalizada
    fontUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont';
      const fontFace = new FontFace(fontName, `url(${URL.createObjectURL(file)})`);
      await fontFace.load();
      document.fonts.add(fontFace);
      editor.style.fontFamily = fontName;
      
      // Agregar opción al select
      const option = document.createElement('option');
      option.value = fontName;
      option.text = "Fuente Personalizada";
      option.selected = true;
      fontSelect.add(option);
    });

    // Descargar Texto
    function downloadTxt() {
      const blob = new Blob([editor.innerText], {type: 'text/plain'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'poema_chino.txt';
      link.click();
    }

    // Descargar Imagen (Captura)
    function downloadImage() {
      // Ocultar scrollbars temporalmente para la foto
      const originalOverflow = editor.style.overflow;
      editor.style.overflow = 'visible';
      
      html2canvas(document.querySelector(".editor-container"), {
        backgroundColor: null,
        scale: 2 // Mayor calidad
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'caligrafia.png';
        link.href = canvas.toDataURL();
        link.click();
        editor.style.overflow = originalOverflow;
      });
    }
  </script>
</body>
</html>
